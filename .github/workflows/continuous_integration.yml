name: continuous integration

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

env:
  ELIXIR_VERSION: 1.20.2
  OTP_VERSION: 28.5.0.4
  MIX_ENV: test

jobs:
  linux:
    name: Build & Test on Linux
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:17
        ports: ['5432:5432']
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Setup BEAM
      uses: erlef/setup-beam@v1
      if: steps.erlef-cache.outputs.cache-hit != 'true'
      with:
        elixir-version: ${{ env.ELIXIR_VERSION }}
        otp-version: ${{ env.OTP_VERSION }}

    - name: Restore dependencies cache
      id: mix-cache
      uses: actions/cache@v4
      with:
        path: |
          deps
          _build
          tmp
          tmp/plts
        key: ${{ runner.os }}-elixir_${{ env.ELIXIR_VERSION }}-erlang_${{ env.OTP_VERSION }}-mix-${{ hashFiles('**/mix.lock') }}
        restore-keys: |
          ${{ runner.os }}-elixir_${{ env.ELIXIR_VERSION }}-erlang_${{ env.OTP_VERSION }}-mix-

    - name: Install dependencies
      if: steps.mix-cache.outputs.cache-hit != 'true'
      run: |
        mix deps.get
        mix deps.compile

    - name: Check unused dependencies
      run: mix deps.unlock --check-unused

    - name: Compile
      run: mix compile --warnings-as-errors

    - name: Check format
      run: mix format --check-formatted

    - name: Analyze code
      run: mix credo -a

    - name: Analyse security
      run: mix sobelow

    - name: Run tests
      run: mix test --warnings-as-errors
